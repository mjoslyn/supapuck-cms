[build]
  command = "node scripts/gen-redirects.mjs && astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vendored and theme assets never change in place; CSS bundles are content-hashed.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The compose worker (netlify/functions/compose-background.mts) processes images with sharp, a native
# module the bundler must leave as a dependency.
[functions]
  external_node_modules = ["sharp"]
